[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama_shim"
version = "1.0.0"
authors = [
    { name="Shane V Cantwell", email="shanevcantwell@github.com" }
]
description = "A service that bridges LM Studio/llama-server with tools expecting an Ollama API"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi[all]>=0.95.0",
    "httpx>=0.25.0",
    "python-dotenv",
    "pydantic_settings",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-httpx",
    "respx",
    "asgi-lifespan",
]

[project.scripts]
ollama-shim = "src.main:main"

[project.urls]
Homepage = "https://github.com/shanevcantwell/ollama-shim"
"Bug Tracker" = "https://github.com/shanevcantwell/ollama_shim/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ollama_shim*"]